exclude: docs/notebooks
# Upstream runs pre-commit.ci too. Two bots bumping the same `rev:` pins on independent
# monthly schedules would make this file conflict at every `git merge upstream/main`.
ci:
  autoupdate_schedule: quarterly
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # - id: double-quote-string-fixer  # for single quotes: uncomment and add black config “skip-string-normalization”
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-case-conflict
      - id: detect-private-key
      # No `no-commit-to-branch`: upstream guards `main` because theirs is a trunk nobody
      # commits to. Ours is the shipping branch we merge into, and the hook is `always_run`,
      # so it makes `pre-commit run --all-files` fail outright whenever HEAD is on `main`.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
    # Run the linter.
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [css, javascript]
