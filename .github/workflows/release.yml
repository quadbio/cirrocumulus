# Builds a wheel containing the web client and publishes it as a Release. See FORK.md.
#
# Pushing `main` builds and verifies; pushing a `quadbio-*` tag also publishes.
name: release

on:
  push:
    branches: [ main ]
    tags: [ 'quadbio-*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wheel:
    if: github.repository == 'quadbio/cirrocumulus'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0        # hatch-vcs reads history and tags
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.x

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.x
          package-manager-cache: false   # nothing to gain, and this job can publish

      # test.yml's recipe. CI=true makes react-scripts fail on warnings; this build warns.
      - name: Build the web client
        run: |
          yarn global add typescript
          yarn install
          yarn build
        env:
          CI: false

      # --wheel: a bare `python -m build` goes via an sdist that duplicates the 12 MB
      # client and drops hatch-vcs onto its no-.git fallback.
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Verify the wheel ships the client
        run: python scripts/check_wheel.py dist/*.whl

      # Not from the repo root: tests/ imports cirrocumulus, so pytest's prepend import
      # mode would check the source tree instead of the wheel.
      - name: Serve it once
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv smoke
          ./smoke/bin/pip install --quiet "$GITHUB_WORKSPACE"/dist/*.whl
          ./smoke/bin/python - <<'PY'
          import re

          from cirrocumulus.launch import create_app

          client = create_app().test_client()
          index = client.get("/")
          assert index.status_code == 200, index.status_code
          assert b'id="root"' in index.data, "/ is not the cirrocumulus shell"
          bundle = re.search(rb'src="\.?/?(static/js/main\.[^"]+\.js)"', index.data)
          assert bundle, "index.html references no main bundle"
          served = client.get("/" + bundle.group(1).decode())
          assert served.status_code == 200, served.status_code
          print("served", bundle.group(1).decode(), len(served.data), "bytes")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel
          path: dist/*.whl

      # --repo: in a fork clone gh can otherwise resolve to upstream.
      # event_name: workflow_dispatch's ref picker offers tags too, and re-creating an
      # existing release fails late, after a full client build.
      - name: Publish the release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.whl \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Built from \`main\`, web client included.

          \`\`\`
          uv tool install <the wheel below>
          \`\`\`

          See [FORK.md](https://github.com/quadbio/cirrocumulus/blob/main/FORK.md)."
